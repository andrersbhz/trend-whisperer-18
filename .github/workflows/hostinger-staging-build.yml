name: Vortex staging Docker build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate isolated staging image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate staging configuration
        env:
          STAGING_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$STAGING_URL" || { echo "::error::Set STAGING_SUPABASE_URL repository variable"; exit 1; }
          test -n "$STAGING_KEY" || { echo "::error::Set STAGING_SUPABASE_PUBLISHABLE_KEY repository variable"; exit 1; }
          case "$STAGING_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::Staging URL must be a Supabase HTTPS project URL"; exit 1 ;;
          esac
      - name: Build staging frontend (no publish or deployment)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: vortex-realtime:staging-validation
          build-args: |
            VITE_SUPABASE_URL=${{ vars.STAGING_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_PROJECT_ID=${{ vars.STAGING_SUPABASE_PROJECT_ID }}
