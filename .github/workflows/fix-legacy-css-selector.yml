name: Fix legacy CSS selector

on:
  push:
    branches: [feat/magnific-media-ui-revamp]
    paths:
      - .github/workflows/fix-legacy-css-selector.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/magnific-media-ui-revamp
      - name: Patch invalid arbitrary-class selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.css')
          s = p.read_text()
          old = 'button.bg-[#a3ff12]:hover,'
          new = 'button[class~="bg-[#a3ff12]"]:hover,'
          if old not in s:
              raise SystemExit('selector not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css
          git commit -m "fix: correct invalid legacy lime button selector"
          git push origin HEAD:feat/magnific-media-ui-revamp
